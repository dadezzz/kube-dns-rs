services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/infra/ci-rust:v1.2.2@sha256:9fb5101cc181f367fbe927a865a9e177fa04d46750f40e3e130e276383223414
    ports:
      - 1053:1053/tcp
      - 1053:1053/udp
