services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/infra/ci-rust:v1.2.0
    ports:
      - 1053:1053/tcp
      - 1053:1053/udp
    volumes:
      - ..:/workspace:z,cached
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /workspace

volumes:
  cargo-cache: {}
