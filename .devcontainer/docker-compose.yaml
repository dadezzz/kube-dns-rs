services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/infra/ci-rust:v2026.11.04.1@sha256:62c3284102ae8d3f3ea2749b897b1d29dc0ef0a5b5ad6671e357d5099319bb41
    ports:
      - 1053:1053/tcp
      - 1053:1053/udp
    volumes:
      - ..:/workspace:z,cached
      - $HOME/.kube:/root/.kube:z,ro
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /workspace

volumes:
  cargo-cache: {}
