services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/infra/ci-rust:v1.2.10@sha256:9a262fdf9deacad26388ed50255c66101d2caab8ee65248c2bb4d4433b1bf175
    ports:
      - 1053:1053/tcp
      - 1053:1053/udp
    volumes:
      - ..:/workspace:z,cached
      - $HOME/.kube:/root/.kube:z,ro
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /workspace

volumes:
  cargo-cache: {}
