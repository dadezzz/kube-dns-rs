services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/infra/ci-rust:v2026.11.07.1@sha256:315a302f8dfcbb3afa63bfa73f895774d7e0321f4057332844afe19fad56cc21
    ports:
      - 1053:1053/tcp
      - 1053:1053/udp
    volumes:
      - ..:/workspace:z,cached
      - $HOME/.kube:/root/.kube:z,ro
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /workspace

volumes:
  cargo-cache: {}
