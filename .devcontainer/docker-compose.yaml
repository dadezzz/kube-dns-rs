services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/infra/ci-rust:v2026.10.30.3@sha256:f3d4d23cec81f28d1f239884a35e56bca1147ba1d874e01da543f32ee04bb24f
    ports:
      - 1053:1053/tcp
      - 1053:1053/udp
    volumes:
      - ..:/workspace:z,cached
      - $HOME/.kube:/root/.kube:z,ro
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /workspace

volumes:
  cargo-cache: {}
