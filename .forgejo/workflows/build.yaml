concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  build:
    container:
      image: git.zarantonello.dev/infra/ci-podman:v2026.11.17.14@sha256:36d3efe22d65834f2abde80050d6c4c93b2a2e03d003bc2a6e83593f4f820111
      volumes:
        - forgejo-runner-cache-podman:/var/lib/containers/storage
    env:
      IMAGE: git.zarantonello.dev/${{ forge.repository }}:${{ forge.ref_name }}
    name: Build the container
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Login to the container registry
        run: podman login git.zarantonello.dev -u ci-bot -p ${{ secrets.CI_BOT_REGISTRY_TOKEN }}
      - name: Build the container image
        run: |
          podman build --network=host \
            --annotation org.opencontainers.image.source="https://git.zarantonello.dev/${{ forge.repository }}" \
            --annotation org.opencontainers.image.url="https://git.zarantonello.dev/${{ forge.repository }}" \
            --annotation org.opencontainers.image.revision="${{ forge.sha }}" \
            --annotation org.opencontainers.image.version="${{ forge.ref_name }}" \
            --tag ${{ env.IMAGE }} .
      - name: Push the container image
        run: podman push ${{ env.IMAGE }}

name: build.yaml

"on":
  push:
    tags:
      - v*
