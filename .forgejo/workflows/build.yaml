concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  build:
    container:
      image: quay.io/containers/aio:latest@sha256:b69c7118807ff3b8ff2eeca90baf916e1e459156ad7ae08690f08fc16fefa243
      volumes:
        - forgejo-runner-cache-podman:/var/lib/containers/storage
    env:
      IMAGE: git.zarantonello.dev/${{ forge.repository }}:${{ forge.ref_name }}
    name: Build the container
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Login to the container registry
        run: podman login git.zarantonello.dev -u ci-bot -p ${{ secrets.CI_BOT_REGISTRY_TOKEN }}
      - name: Build the container image
        run: |
          podman build \
            --label org.opencontainers.image.source="https://git.zarantonello.dev/${{ forge.repository }}" \
            --label org.opencontainers.image.revision="${{ forge.sha }}" \
            --tag ${{ env.IMAGE }} .
      - name: Push the container image
        run: podman push ${{ env.IMAGE }}

name: build.yaml

"on":
  push:
    tags:
      - v*
