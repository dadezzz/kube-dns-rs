concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/infra/ci-rust:v2026.11.04.1@sha256:62c3284102ae8d3f3ea2749b897b1d29dc0ef0a5b5ad6671e357d5099319bb41
      volumes:
        - forgejo-runner-cache-cargo-registry:/usr/local/cargo/registry
        - forgejo-runner-cache-projects-kube-dns-rs-target:/target
    env:
      CARGO_TARGET_DIR: /target
    name: Checks
    runs-on: srv-home
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run linter
        run: cargo clippy
      - name: Run types and syntax check
        run: cargo check
      - name: Run tests
        run: cargo test

name: check.yaml

"on":
  pull_request:
    branches:
      - main
