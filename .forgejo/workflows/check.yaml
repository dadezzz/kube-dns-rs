concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/infra/ci-rust:v2026.10.30.3@sha256:f3d4d23cec81f28d1f239884a35e56bca1147ba1d874e01da543f32ee04bb24f
      volumes:
        - forgejo-runner-cache-cargo-registry:/usr/local/cargo/registry
        - forgejo-runner-cache-projects-kube-dns-rs-target:/target
    env:
      CARGO_TARGET_DIR: /target
    name: Checks
    runs-on: srv-home
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run linter
        run: cargo clippy
      - name: Run types and syntax check
        run: cargo check
      - name: Run tests
        run: cargo test

name: check.yaml

"on":
  pull_request:
    branches:
      - main
