concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/infra/ci-rust:v1.2.10@sha256:9a262fdf9deacad26388ed50255c66101d2caab8ee65248c2bb4d4433b1bf175
      volumes:
        - forgejo-runner-cache-cargo-registry:/usr/local/cargo/registry
        - forgejo-runner-cache-projects-kube-dns-rs-target:/target
    env:
      CARGO_TARGET_DIR: /target
    name: Checks
    runs-on: srv-home
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run linter
        run: cargo clippy
      - name: Run types and syntax check
        run: cargo check
      - name: Run tests
        run: cargo test

name: check.yaml

"on":
  pull_request:
    branches:
      - main
