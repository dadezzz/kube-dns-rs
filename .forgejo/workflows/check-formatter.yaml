concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/infra/ci-rust:v1.2.4@sha256:60a52eda7d1525b627b39a9306dd0cd2fdd31e29877e672d5a36695cc8d90eb5
    name: Check with formatters
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run formatter
        run: cargo fmt --check

name: check-formatter.yaml

"on":
  pull_request:
    branches:
      - main
