concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/infra/ci-rust:v1.2.1@sha256:5e5a80a9f111855679206795e50c385b918dcabe92e1ecac35cde5fbfa61f9ca
    name: Check with formatters
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run formatter
        run: cargo fmt --check

name: check-formatter.yaml

"on":
  pull_request:
    branches:
      - main
