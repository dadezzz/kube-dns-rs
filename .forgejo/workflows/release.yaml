concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  release:
    container:
      image: git.zarantonello.dev/infra/ci-semantic-release:v1.0.2@sha256:e04bd8d1ef225a118e6c79be72661d7d1162866833a1a0f73c2a13bc4c09cd00
    name: Generate next release tag
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ secrets.CI_BOT_TOKEN }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - env:
          FORGEJO_API_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        name: Run semantic-release
        run: |
          git config --global user.name "CI [bot]"
          git config --global user.email "ci-bot@git.zarantonello.dev"

          semantic-release

name: release.yaml

"on":
  push:
    branches:
      - main
