concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check-biome:
    container:
      image: git.zarantonello.dev/infra/ci-biome:v2026.11.01.1@sha256:82142df6c9cc6ecc6dae30a1296454da4031231e050f04a4e81cd4e17975dfbe
    name: Check files with biome
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run biome
        run: biome ci --reporter summary >> $FORGEJO_STEP_SUMMARY

name: check-biome.yaml

"on":
  pull_request:
    branches:
      - main
