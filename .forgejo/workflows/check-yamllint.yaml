concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check-yamllint:
    container:
      image: git.zarantonello.dev/infra/ci-yamllint:v2026.11.07.1@sha256:c42eb5f367a9d3d83367a48dff79e96070bccf0b42e9d7e0daa59430a092666e
    name: Lint yaml files
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run yamllint
        run: yamllint -f parsable . >> $FORGEJO_STEP_SUMMARY

name: check-yamllint.yaml

"on":
  pull_request:
    branches:
      - main
