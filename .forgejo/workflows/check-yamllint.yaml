concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check-yamllint:
    container:
      image: git.zarantonello.dev/infra/ci-yamllint:v2026.11.06.1@sha256:3db4d78f3c8a2a7355c89110ff6066d3fea4e4695b127999e3e9d9ef4d8724b1
    name: Lint yaml files
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run yamllint
        run: yamllint -f parsable . >> $FORGEJO_STEP_SUMMARY

name: check-yamllint.yaml

"on":
  pull_request:
    branches:
      - main
