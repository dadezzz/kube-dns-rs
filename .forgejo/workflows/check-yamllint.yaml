concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check-yamllint:
    container:
      image: git.zarantonello.dev/infra/ci-yamllint:v2026.10.30.2@sha256:5a60f8847d40e3c3f8538d354606265ed280b3e7d8c7338db688dc3bd543b87e
    name: Lint yaml files
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Run yamllint
        run: yamllint -f parsable . >> $FORGEJO_STEP_SUMMARY

name: check-yamllint.yaml

"on":
  pull_request:
    branches:
      - main
