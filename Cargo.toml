[package]
name = "kube-dns-rs"
version = "0.1.0"
edition = "2024"
default-run = "kube-dns-rs"


[[bin]]
name = "kube-dns-rs"

[[bin]]
name = "crdgen"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.25", features = ["yaml"], default-features = false }
futures = { version = "0.3.34", default-features = false }
hickory-resolver = { version = "0.26.3", features = ["tls-aws-lc-rs"], default-features = false }
hickory-server = { version = "0.26.3" }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "aws-lc-rs", "rustls-tls", "runtime", "derive"] }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "charset", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
webpki-roots = "1.0.11"
yaml_serde = "0.10.7"
