[package]
name = "kube-dns-rs"
version = "0.1.0"
edition = "2024"
default-run = "kube-dns-rs"


[[bin]]
name = "kube-dns-rs"

[[bin]]
name = "crdgen"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", features = ["yaml"], default-features = false }
futures = { version = "0.3.34", default-features = false }
hickory-server = { version = "0.26.1", features = ["tls-aws-lc-rs", "resolver", "webpki-roots"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "aws-lc-rs", "rustls-tls", "webpki-roots", "runtime", "derive"] }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "http2", "charset", "rustls"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
